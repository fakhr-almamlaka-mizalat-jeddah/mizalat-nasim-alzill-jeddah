<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F6F6F"/>
      <stop offset="1" stop-color="#134C4C"/>
    </linearGradient>
  </defs>

  <!-- Mark: a single tensioned shade arc over three tent-peak points, with breeze lines trailing -->
  <g transform="translate(30,20)">
    <path d="M10,140 Q80,10 150,140" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
    <path d="M40,140 L80,60 L120,140" fill="none" stroke="#C68B3C" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- breeze lines -->
    <path d="M150,55 C175,50 190,60 210,55" fill="none" stroke="#C68B3C" stroke-width="5" stroke-linecap="round"/>
    <path d="M158,75 C180,71 198,80 222,74" fill="none" stroke="#1F6F6F" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M150,95 C170,92 185,99 205,95" fill="none" stroke="#C68B3C" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="95" text-anchor="end" font-family="Amiri, 'Noto Naskh Arabic', serif" font-size="46" fill="#241C14" font-weight="700">نسيم الظل</text>
  <text x="500" y="130" text-anchor="end" font-family="'Tajawal','IBM Plex Sans Arabic',sans-serif" font-size="18" letter-spacing="1" fill="#5B4A36">للمظلات والسواتر — جدة</text>
</svg>
